[project]
name = "conversion-gateway"
version = "0.1.0"
description = "Server-side first-party conversion gateway: CRM lead events in, hashed offline conversions out."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=9.0",
    "phonenumbers>=8.13",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
# Tests import `gateway` directly; pointing pytest at src/ avoids needing an
# editable install just to run the suite.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage on every run, failing under the floor. The floor is high because
# the core of this system is pure functions with fixture tables; if it drops,
# something was added without its table.
addopts = "--cov=gateway --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/gateway"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The fixture tables hold a 64-char literal digest per row. One row per line
# is what makes them readable as a spec, so line length does not apply there.
"tests/normalise/test_normalise.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
