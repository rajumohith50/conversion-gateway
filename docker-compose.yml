# Local stack. One command brings up everything the gateway needs.
# Later phases add the gateway, worker and mock ads API services here; the
# `make run` / `make down` targets do not change.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Google Cloud Pub/Sub emulator. Speaks the real Pub/Sub API with no
  # credentials, so the same PubSubPublisher / PubSubConsumer code runs
  # locally and in production with only PUBSUB_EMULATOR_HOST changing.
  # It has no persistence: `make queue-init` recreates the topic and
  # subscription after every restart.
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=local-project
    ports:
      - "8085:8085"

volumes:
  postgres-data:
